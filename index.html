<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ann Mahé — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #00ff88;
      --accent-dim: rgba(0,255,136,0.12);
      --accent-mid: rgba(0,255,136,0.35);

      /* Theme A: Dark terminal */
      --bg-a: #0c0c0c;
      --surface-a: #141414;
      --border-a: rgba(255,255,255,0.08);
      --text-a: #e8e8e4;
      --text-dim-a: rgba(232,232,228,0.45);
      --card-bg-a: #111111;

      /* Theme B: White editorial */
      --bg-b: #fafaf8;
      --surface-b: #f2f2ef;
      --border-b: rgba(0,0,0,0.1);
      --text-b: #111110;
      --text-dim-b: rgba(17,17,16,0.45);
      --card-bg-b: #ffffff;
    }

    html { scroll-behavior: auto; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s, color 0.4s;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent-mid); border-radius: 2px; }

    /* Typography */
    .serif { font-family: 'DM Serif Display', serif; }
    .mono { font-family: 'DM Mono', monospace; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scanline {
      from { transform: translateY(-100%); }
      to { transform: translateY(100vh); }
    }

    .animate-up {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .animate-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Layout */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 48px;
    }
    @media (max-width: 768px) {
      .container { padding: 0 24px; }
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--bg) 80%, transparent);
      transition: background 0.4s, border-color 0.4s;
    }
    .nav-logo {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }
    .nav-links a {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 80px;
      position: relative;
      overflow: hidden;
    }
    .hero-grid-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image:
        linear-gradient(var(--text) 1px, transparent 1px),
        linear-gradient(90deg, var(--text) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .hero-content {
      position: relative;
      z-index: 1;
    }
    .hero-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero-eyebrow::before {
      display: none;
    }
    .hero-name {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(56px, 8vw, 112px);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 8px;
    }
    .hero-name-italic {
      font-style: italic;
      color: var(--accent);
    }
    .hero-tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 300;
      color: var(--text-dim);
      margin-top: 28px;
      max-width: 520px;
      line-height: 1.6;
    }
    .hero-cta {
      margin-top: 48px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--accent);
      border: none;
      padding: 14px 28px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-ghost {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid var(--border);
      padding: 14px 28px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: color 0.2s, border-color 0.2s, transform 0.2s;
    }
    .btn-ghost:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }

    /* Section headers */
    .section-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 56px;
    }
    .section-num {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.1em;
    }
    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(28px, 3.5vw, 42px);
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Sections */
    section {
      padding: 100px 0;
    }
    section + section {
      border-top: 1px solid var(--border);
    }

    /* About */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
    }
    .about-text {
      font-size: 17px;
      font-weight: 300;
      line-height: 1.75;
      color: var(--text);
    }
    .about-text p + p { margin-top: 20px; }
    .about-portrait {
      float: right;
      width: 180px;
      height: 180px;
      margin: 4px 0 16px 28px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--border);
      shape-outside: circle(50%);
    }
    .about-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.95);
      transition: filter 0.5s ease, transform 0.6s ease;
    }
    .about-portrait:hover img {
      filter: saturate(1.1);
      transform: scale(1.04);
    }
    @media (max-width: 760px) {
      .about-portrait { width: 140px; height: 140px; margin-left: 20px; }
    }
    .about-highlight {
      color: var(--accent);
      font-style: italic;
      font-family: 'DM Serif Display', serif;
    }
    .skills-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .skill-group-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .skill-tag {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      background: transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .skill-tag:hover { border-color: var(--accent); color: var(--accent); }
    .role-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .role-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 10px;
      border-left: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .role-item:hover { border-left-color: var(--accent); }
    .role-title {
      font-size: 13px;
      color: var(--text);
      letter-spacing: -0.005em;
    }
    .role-org {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Experience variants */
    .role-timeline { position: relative; padding-left: 20px; display: flex; flex-direction: column; gap: 20px; }
    .role-timeline::before { content: ''; position: absolute; left: 3px; top: 6px; bottom: 6px; width: 1px; background: var(--border); }
    .rt-item { position: relative; }
    .rt-item::before { content: ''; position: absolute; left: -20px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); border: 1px solid var(--accent-mid); transition: background 0.25s, border-color 0.25s; }
    .rt-item:hover::before { background: var(--accent); border-color: var(--accent); }
    .rt-role { font-family: 'DM Serif Display', serif; font-size: 17px; letter-spacing: -0.01em; color: var(--text); line-height: 1.25; transition: color 0.25s; }
    .rt-item:hover .rt-role { color: var(--accent); }
    .rt-org { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-top: 5px; }

    .role-display { display: flex; flex-direction: column; gap: 22px; }
    .rd-item { border-left: 2px solid var(--accent-mid); padding-left: 14px; transition: border-color 0.25s; }
    .rd-item:hover { border-left-color: var(--accent); }
    .rd-role { font-family: 'DM Serif Display', serif; font-size: 19px; line-height: 1.2; letter-spacing: -0.015em; color: var(--text); transition: color 0.25s; }
    .rd-item:hover .rd-role { color: var(--accent); }
    .rd-org { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-top: 7px; }

    .role-cards { display: flex; flex-direction: column; gap: 10px; }
    .rc-item { border: 1px solid var(--border); background: var(--card-bg); padding: 16px 18px; transition: border-color 0.25s, transform 0.25s; }
    .rc-item:hover { border-color: var(--accent-mid); transform: translateX(4px); }
    .rc-role { font-size: 14.5px; font-weight: 500; color: var(--text); line-height: 1.3; }
    .rc-org { font-family: 'DM Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }

    /* Projects */
    .projects-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .project-card {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 32px;
      align-items: start;
      padding: 40px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    .project-card:first-child {
      border-top: 1px solid var(--border);
    }
    .project-card::after {
      content: '';
      position: absolute;
      left: -48px;
      right: -48px;
      top: 0;
      bottom: 0;
      background: var(--accent-dim);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .project-card:hover::after { opacity: 1; }

    .project-num {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      padding-top: 4px;
    }
    .project-body { position: relative; z-index: 1; }
    .project-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(22px, 2.5vw, 30px);
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
      transition: color 0.2s;
    }
    .project-card:hover .project-title { color: var(--accent); }
    .project-desc {
      font-size: 15px;
      font-weight: 300;
      color: var(--text-dim);
      line-height: 1.65;
      max-width: 560px;
      margin-bottom: 16px;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .project-tag {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 3px 10px;
    }
    .project-tag.highlight {
      border-color: var(--accent-mid);
      color: var(--accent);
      background: var(--accent-dim);
    }
    .project-arrow {
      font-size: 20px;
      color: var(--text-dim);
      padding-top: 4px;
      transition: color 0.2s, transform 0.2s;
      position: relative;
      z-index: 1;
    }
    .project-card:hover .project-arrow {
      color: var(--accent);
      transform: translate(4px, -4px);
    }

    /* Stacked projects */
    .projects-stack { position: relative; height: calc(var(--n) * 100vh); }
    .stack-stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }

    /* Also into */
    .interests-panel {
      position: relative;
      z-index: 20;
      background: var(--bg);
      padding: 88px 0 40px;
      min-height: 0;
    }
    .interests-head { display: flex; align-items: center; gap: 16px; margin-bottom: 48px; }
    .interests-head .section-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 0.1em; }
    .interests-head h2 { font-family: 'DM Serif Display', serif; font-size: clamp(28px, 4vw, 52px); font-weight: 400; letter-spacing: -0.02em; }
    .interests-head .section-line { flex: 1; height: 1px; background: var(--border); }

    #contact { position: relative; z-index: 30; background: var(--bg); }

    /* variant: typewriter */
    .it-wrap { min-height: 200px; display: flex; flex-direction: column; justify-content: center; }
    .it-stage { display: flex; align-items: center; gap: 34px; }
    .it-fig { width: 108px; height: 86px; flex: none; color: var(--accent); animation: figIn 0.5s cubic-bezier(0.2,0,0.2,1); }
    .it-fig svg { overflow: visible; }
    .sk-float { animation: skFloat 3.2s ease-in-out infinite; }
    .sk-steam { animation: skSteam 2.6s ease-in-out infinite; transform-origin: bottom; }
    .sk-bob { animation: skBob 3s ease-in-out infinite; }
    .sk-wave { animation: skWave 2.4s ease-in-out infinite; }
    .sk-bounce { animation: skBounce 1.5s cubic-bezier(0.4,0,0.5,1) infinite; }
    .sk-carve { animation: skCarve 3.6s ease-in-out infinite; transform-origin: 60px 50px; }
    .sk-fan1 { animation: skFan1 3.4s ease-in-out infinite; transform-origin: 40px 72px; }
    .sk-fan2 { animation: skFan2 3.4s ease-in-out infinite; transform-origin: 80px 72px; }
    .sk-d2 { animation-delay: 0.55s; }
    @keyframes skFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes skSteam { 0% { opacity: 0.25; transform: translateY(3px) scaleY(0.92) } 50% { opacity: 0.85; transform: translateY(-3px) scaleY(1.05) } 100% { opacity: 0.25; transform: translateY(3px) scaleY(0.92) } }
    @keyframes skBob { 0%,100% { transform: translateY(0) rotate(0deg) } 50% { transform: translateY(-4px) rotate(-2deg) } }
    @keyframes skWave { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-11px) } }
    @keyframes skBounce { 0% { transform: translateY(0) } 45% { transform: translateY(34px) scaleY(0.94) } 60% { transform: translateY(28px) } 100% { transform: translateY(0) } }
    @keyframes skCarve { 0%,100% { transform: rotate(-4deg) translateY(0) } 50% { transform: rotate(5deg) translateY(-3px) } }
    @keyframes skFan1 { 0%,100% { transform: rotate(-10deg) } 50% { transform: rotate(-19deg) } }
    @keyframes skFan2 { 0%,100% { transform: rotate(10deg) } 50% { transform: rotate(19deg) } }
    @media (prefers-reduced-motion: reduce) { .sk-float, .sk-steam, .sk-bob, .sk-wave, .sk-bounce, .sk-carve, .sk-fan1, .sk-fan2 { animation: none } }
    @keyframes figIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .it-line { font-family: 'DM Serif Display', serif; font-size: clamp(36px, 7vw, 88px); line-height: 1.08; letter-spacing: -0.03em; color: var(--text); }
    .it-caret { display: inline-block; width: 3px; height: 0.78em; background: var(--accent); margin-left: 8px; vertical-align: baseline; animation: blink 1s steps(1) infinite; }
    .it-dots { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 44px; }
    .it-dot { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); opacity: 0.5; transition: color 0.3s, opacity 0.3s; background: none; border: 0; padding: 0; cursor: pointer; }
    .it-dot:hover { opacity: 1; color: var(--text); }
    .it-dot.on { color: var(--accent); opacity: 1; }

    /* variant: cards */
    .fan { display: flex; justify-content: center; align-items: center; min-height: 340px; padding: 30px 0; perspective: 1400px; }
    .fan-card { width: 168px; height: 246px; margin: 0 -30px; position: relative; transform: rotate(var(--r)) translateY(var(--y)); transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.2,0,0.2,1), margin 0.55s cubic-bezier(0.2,0,0.2,1); cursor: pointer; }
    .fan:hover .fan-card { margin: 0 8px; }
    .fan-card:hover { transform: rotate(0deg) translateY(-22px); z-index: 5; }
    .fan-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.3,0,0.2,1); }
    .fan-card:hover .fan-inner { transform: rotateY(180deg); }
    .fan-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--border); background: var(--card-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; }
    .fan-front { background-image: repeating-linear-gradient(45deg, var(--accent-dim) 0 6px, transparent 6px 12px); }
    .fan-mark { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); }
    .fan-back { transform: rotateY(180deg); border-color: var(--accent-mid); }
    .fan-name { font-family: 'DM Serif Display', serif; font-size: 22px; line-height: 1.15; letter-spacing: -0.01em; color: var(--text); }
    .fan-note { font-family: 'DM Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
    .fan-hint { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); text-align: center; margin-top: 8px; }

    /* variant: wipe */
    .wp-list { display: flex; flex-direction: column; }
    .wp-row { border-bottom: 1px solid var(--border); padding: 24px 0; overflow: hidden; display: flex; align-items: baseline; gap: 20px; }
    .wp-row:first-child { border-top: 1px solid var(--border); }
    .wp-name { font-family: 'DM Serif Display', serif; font-size: clamp(30px, 4.6vw, 62px); letter-spacing: -0.025em; line-height: 1.05; color: var(--text); clip-path: inset(0 100% 0 0); transform: translateY(0.16em); transition: clip-path 0.95s cubic-bezier(0.2,0,0.2,1), transform 0.95s cubic-bezier(0.2,0,0.2,1), color 0.3s; }
    .wp-row.in .wp-name { clip-path: inset(0 0 0 0); transform: translateY(0); }
    .wp-row:hover .wp-name { color: var(--accent); }

function useTheme(themeName, accentColor) {
  const t = THEMES[themeName] || THEMES.dark;
  const accent = t.accent || accentColor;
  React.useEffect(() => {
    const root = document.documentElement;
    Object.entries({
      '--bg': t.bg,
      '--surface': t.surface,
      '--border': t.border,
      '--text': t.text,
      '--text-dim': t.textDim,
      '--card-bg': t.cardBg,
      '--accent': accent,
      '--accent-dim': accent + '1e',
      '--accent-mid': accent + '59'
    }).forEach(([k, v]) => root.style.setProperty(k, v));
  }, [themeName, accentColor]);
}

function useScrollAnimation(deps) {
  React.useEffect(() => {
    let raf = 0, observer = null;
    const reveal = (el) => el.classList.add('visible');
    const sweep = () => {
      document.querySelectorAll('.animate-up:not(.visible)').forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight * 0.92 && r.bottom > 0) reveal(el);
      });
    };
    const run = () => {
      sweep();
      if (typeof IntersectionObserver === 'function') {
        observer = new IntersectionObserver(
          (entries) => entries.forEach((e) => { if (e.isIntersecting) reveal(e.target); }),
          { threshold: 0, rootMargin: '0px 0px -8% 0px' }
        );
        document.querySelectorAll('.animate-up:not(.visible)').forEach((el) => observer.observe(el));
      }
    };
    raf = requestAnimationFrame(run);
    window.addEventListener('scroll', sweep, { passive: true });
    window.addEventListener('resize', sweep);
    const safety = setTimeout(() => document.querySelectorAll('.animate-up').forEach(reveal), 2500);
    return () => {
      cancelAnimationFrame(raf);
      clearTimeout(safety);
      window.removeEventListener('scroll', sweep);
      window.removeEventListener('resize', sweep);
      if (observer) observer.disconnect();
    };
  }, deps);
}

function CursorDot({ enabled }) {
  const dotRef = React.useRef(null);
  React.useEffect(() => {
    if (!enabled) return;
    const move = (e) => {
      if (dotRef.current) {
        dotRef.current.style.left = e.clientX + 'px';
        dotRef.current.style.top = e.clientY + 'px';
      }
    };
    window.addEventListener('mousemove', move);
    return () => window.removeEventListener('mousemove', move);
  }, [enabled]);
  if (!enabled) return null;
  return <div className="cursor-dot" ref={dotRef} />;
}

function useTypewriter(lines, { startDelay = 300, charDelay = 38, lineDelay = 180 } = {}) {
  const [displayed, setDisplayed] = React.useState(lines.map(() => ''));
  const [allDone, setAllDone] = React.useState(false);

  React.useEffect(() => {
    let cancelled = false;
    async function type() {
      await new Promise((r) => setTimeout(r, startDelay));
      for (let i = 0; i < lines.length; i++) {
        for (let j = 0; j <= lines[i].length; j++) {
          if (cancelled) return;
          setDisplayed((prev) => prev.map((v, idx) => idx === i ? lines[i].slice(0, j) : v));
          await new Promise((r) => setTimeout(r, charDelay));
        }
        if (i < lines.length - 1) await new Promise((r) => setTimeout(r, lineDelay));
      }
      setAllDone(true);
    }
    type();
    return () => {cancelled = true;};
  }, []);

  return [displayed, allDone];
}

function useStackScroll(ref, count, active) {
  React.useEffect(() => {
    if (!active) return;
    const wrap = ref.current;
    if (!wrap) return;
    let raf = 0;
    const layout = () => {
      raf = 0;
      const cards = [...wrap.querySelectorAll('.stack-card')];
      if (!cards.length) return;
      const cs = getComputedStyle(wrap);
      const base = parseFloat(cs.getPropertyValue('--stack-base')) || 72;
      const strip = parseFloat(cs.getPropertyValue('--strip')) || 96;
      const vh = window.innerHeight;
      if (window.innerWidth <= 768) {
        cards.forEach((c) => c.style.transform = '');
        return;
      }
      const r = wrap.getBoundingClientRect();
      const span = Math.max(1, wrap.offsetHeight - vh);
      const p = Math.min(1, Math.max(0, -r.top / span));
      const act = p * (count - 1);
      const heights = cards.map((c) => c.offsetHeight);
      const need = (i) => Math.max(0, base + i * strip + heights[i] + 28 - vh);
      const i0 = Math.min(count - 1, Math.floor(act));
      const i1 = Math.min(count - 1, i0 + 1);
      const fr = Math.min(1, Math.max(0, act - i0));
      const shift = need(i0) + (need(i1) - need(i0)) * (fr * fr * (3 - 2 * fr));
      cards.forEach((c, i) => {
        const t = i === 0 ? 1 : Math.min(1, Math.max(0, act - (i - 1)));
        const e = t * t * (3 - 2 * t);
        const y = (1 - e) * (vh - 8) + e * (base + i * strip - shift);
        c.style.transform = `translate3d(0, ${y.toFixed(1)}px, 0)`;
      });
    };
    const onScroll = () => {
      layout();
      if (!raf) raf = requestAnimationFrame(layout);
    };
    layout();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [ref, count, active]);
}

function useCycleTyper(items, on) {
  const [idx, setIdx] = React.useState(0);
  const [len, setLen] = React.useState(0);
  const [erasing, setErasing] = React.useState(false);
  React.useEffect(() => {
    if (!on) return;
    const word = items[idx];
    let t;
    if (!erasing && len < word.length) t = setTimeout(() => setLen(len + 1), 62);
    else if (!erasing && len === word.length) t = setTimeout(() => setErasing(true), 1500);
    else if (erasing && len > 0) t = setTimeout(() => setLen(len - 1), 28);
    else {
      setErasing(false);
      setIdx((i) => (i + 1) % items.length);
    }
    return () => clearTimeout(t);
  }, [len, erasing, idx, on, items]);
  const jump = React.useCallback((n) => { setIdx(n); setErasing(false); setLen(items[n].length); }, [items]);
  return [items[idx].slice(0, len), idx, jump];
}

function WipeRow({ item, index }) {
  const ref = React.useRef(null);
  const [seen, setSeen] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (es) => es.forEach((e) => e.isIntersecting && setSeen(true)),
      { threshold: 0.4 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} className={`wp-row${seen ? ' in' : ''}`}>
          <span className="wp-name" style={{ transitionDelay: `${index * 0.09}s` }}>{item.name}</span>
          {item.note ? <span className="wp-note">{item.note}</span> : null}
        </div>);

}

      duration: 1.3,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothTouch: false,
    });

    // Scroll progress bar
    const progressBar = document.createElement('div');
    progressBar.className = 'scroll-progress';
    document.body.appendChild(progressBar);

    lenis.on('scroll', ({ progress }) => {
      progressBar.style.width = (progress * 100) + '%';
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Smooth anchor clicks — re-bind after React renders
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', (e) => {
        const id = anchor.getAttribute('href').slice(1);
        const target = document.getElementById(id);
        if (target) {
          e.preventDefault();
          lenis.scrollTo(target, { offset: -80, duration: 1.6 });
        }
      });
    });

    // Subtle hero parallax
    const heroGrid = document.querySelector('.hero-grid-bg');
    const heroContent = document.querySelector('.hero-content');
    lenis.on('scroll', ({ scroll }) => {
      if (heroGrid) heroGrid.style.transform = `translateY(${scroll * 0.25}px)`;
      if (heroContent) heroContent.style.transform = `translateY(${scroll * 0.12}px)`;
    });
  }, 300);
</script>
</body>
</html>
